# 앱 아이콘 — 원본을 바꾸면 두 단계:
#   dart run scripts/make_app_icons.dart   # 원본 app_icon.png → app_icon_rounded.png · app_icon_ios.png
#   dart run flutter_launcher_icons
# 원본은 그림 안에 둥근 테두리가 그려져 있고, 그 바깥 네 모서리가 남색 사각이다.
#   app_icon_rounded.png — 바깥 모서리만 투명(2026-09-24). Android · 웹 · Windows · macOS
#   app_icon_ios.png     — 알파 없음. 테두리 띠를 iOS 가 깎는 모양에 맞춰 다시 그린 것
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  image_path_android: "assets/images/app_icon_rounded.png"
  image_path_ios: "assets/images/app_icon_ios.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon_rounded.png"
    background_color: "#050510"
    theme_color: "#050510"
  windows:
    generate: true
    image_path: "assets/images/app_icon_rounded.png"
    icon_size: 48 # Optional: specify icon size
  macos:
    generate: true
    image_path: "assets/images/app_icon_rounded.png"
