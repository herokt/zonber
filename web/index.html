<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- 엔진(canvaskit)·Firebase·글꼴 서버에 미리 연결해 둔다 — 첫 요청의 연결 지연을 줄인다 -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="zonber">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>zonber</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 첫 화면이 그려질 때까지 보이는 로딩 표시 (flutter-first-frame 때 지운다) */
    body { margin: 0; background: #0f1115; }
    @media (prefers-color-scheme: light) { body { background: #f5f6f8; } }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #boot div { width: 22px; height: 22px; border: 2.4px solid rgba(99, 102, 241, .25); border-top-color: #6366f1;
      border-radius: 50%; animation: boot-spin .8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="boot"><div></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
